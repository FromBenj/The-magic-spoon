<script id="spoons-carousel-template" type="text/template">
    <div class="swiper">
    <div class="swiper-wrapper">
        {{#spoons}}
        <div class="swiper-slide p-1 pt-3" data-hash="{{index}}">
            <div class="slide-content w-100 h-100">
                <h3>{{ingredient}}</h3>
                <h5>{{weight}} {{weight}}</h5>
            </div>
        </div>
        {{/spoons}}
    </div>
    <div class="swiper-pagination"></div>
</div>
</script>
